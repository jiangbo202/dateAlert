name = "date-alert"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "date-alert"
database_id = "00000000-0000-0000-0000-000000000000"  # 占位；Cloudflare 一键部署会自动创建并替换，手动部署见 README
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
